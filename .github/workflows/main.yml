## หมายเหตุ : ทำไมถึงเลือกทำเรื่อง “แคลคูลัสกับน้องแมว”

ที่เลือกทำหัวข้อ “แคลคูลัสกับน้องแมว” เพราะต้องการนำเรื่องที่เรียนในวิชาแคลคูลัสมาประยุกต์ใช้กับสิ่งที่พบเห็นได้ในชีวิตประจำวัน  
โดยเลือกน้องแมวมาเป็นตัวอย่างเนื่องจากเป็นสิ่งที่ใกล้ตัวและสามารถนำมาสร้างสถานการณ์ที่น่าสนใจเพื่ออธิบายแนวคิดทางคณิตศาสตร์ได้ง่ายขึ้น

การทำหัวข้อนี้ยังช่วยให้เห็นว่าแคลคูลัสไม่ได้เป็นเพียงเรื่องของสูตรหรือการคำนวณในห้องเรียนเท่านั้น  
แต่สามารถนำแนวคิดเรื่องการเปลี่ยนแปลง อัตราการเปลี่ยนแปลง และการเคลื่อนที่ มาประยุกต์กับสถานการณ์ต่าง ๆ ได้  
ทำให้การเรียนแคลคูลัสดูน่าสนใจและเข้าใจได้ง่ายมากขึ้น

