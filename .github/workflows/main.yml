# แคลคูลัสกับน้องแมว

## ปัจจัยสำคัญสำหรับเลี้ยงแมว

1. **น้ำหนักตัว** - ตัวชี้วัดสุขภาพพื้นฐานของสัตว์เลี้ยง ควรชั่งน้ำหนักสม่ำเสมอ
2. **อายุ** - ส่งผลต่อความต้องการพลังงานและสารอาหารในแต่ละช่วงวัย
3. **ระดับกิจกรรม** - สัตว์เลี้ยงที่เคลื่อนไหวมาก ต้องการพลังงานมากกว่า
4. **ปริมาณอาหารที่ได้รับ** - ต้องสมดุลกับความต้องการพลังงานของร่างกาย
5. **พลังงานที่ได้รับและใช้** - สมดุลพลังงานกำหนดการเพิ่มหรือลดน้ำหนัก

---

## ตัวอย่างการเปลี่ยนแปลงน้ำหนัก

### น้ำหนักเพิ่มขึ้นเร็วแค่ไหน?
ข้อมูลน้ำหนักสัตว์เลี้ยงในช่วงเวลาต่าง ๆ:
$$1\text{ kg} \rightarrow 4.2\text{ kg} \rightarrow 4.5\text{ kg} \rightarrow 4.9\text{ kg}$$

สังเกตได้ว่าน้ำหนักเพิ่มขึ้นในแต่ละช่วง:
- ช่วงที่ 1: +0.2 kg
- ช่วงที่ 2: +0.3 kg
- ช่วงที่ 3: +0.4 kg

อัตราการเพิ่มน้ำหนักมีแนวโน้มสูงขึ้นเรื่อย ๆ

> **เจ้าของชั่งน้ำหนักแมวทุกสัปดาห์**  
> น้ำหนักแมวเพิ่มขึ้นตามลำดับ: $4.0 \rightarrow 4.2 \rightarrow 4.5 \rightarrow 4.9\text{ kg}$

---

## การประยุกต์ใช้คณิตศาสตร์

| สัญลักษณ์ / เครื่องมือ | ชื่อเรียก | การนำไปใช้ |
| :--- | :--- | :--- |
| **Slope** $\rightarrow$ | Slope | ดูน้ำหนักแมวเพิ่มขึ้นเร็วแค่ไหน |
| **$f'(x)$** $\rightarrow$ | Derivative | ดูอัตราการเพิ่มขึ้นของน้ำหนักในช่วงเวลาหนึ่ง |
| **Graph** $\rightarrow$ | Graph | ดูแนวโน้มของน้ำหนัก |
| **Lim** $\rightarrow$ | Limit | ศึกษาแนวโน้มของน้ำหนักเมื่อเวลาผ่านไป |
| **$\int$** $\rightarrow$ | Integer (Integral) | รวมการใช้พลังงานสะสมในช่วงเวลาที่สนใจ |

จากนั้นนำข้อมูลนี้ไปใช้ในการดูแลสัตว์เลี้ยงอย่างเหมาะสม

---

## ความชัน (Slope) กับน้ำหนักของสัตว์

ความชันใช้บอกว่า **“สิ่งหนึ่งเปลี่ยนเร็วแค่ไหนเมื่ออีกสิ่งหนึ่งเปลี่ยน”**

### สูตร
$$m = \frac{y_2 - y_1}{x_2 - x_1}$$

สำหรับสัตว์เลี้ยง:
- $x = \text{เวลา}$
- $y = \text{น้ำหนัก}$
- $m = \text{อัตราการเปลี่ยนแปลงของน้ำหนัก}$

**ตัวอย่าง:** น้องแมวหนัก
- เดือนที่ $1 = 4\text{ kg}$
- เดือนที่ $4 = 6\text{ kg}$

**ดังนั้น:**
$$m = \frac{6 - 4}{4 - 1}$$
$$m = \frac{2}{3}$$
$$m = 0.66$$

**ความหมาย:** น้ำหนักเพิ่มขึ้นเฉลี่ยประมาณ $0.66\text{ kg/เดือน}$

---

## แคลคูลัสเบื้องต้น: ลิมิต (Limit) คืออะไร?

ทำความเข้าใจการเข้าใกล้ค่า ผ่านตัวอย่างน้ำหนักแมว

### แนวคิดสำคัญ
ลิมิตคือการพิจารณาว่าค่าของสิ่งหนึ่งกำลังเข้าใกล้ค่าใด เมื่ออีกสิ่งหนึ่งเข้าใกล้ค่าที่กำหนด เขียนได้ว่า:
$$\lim_{x \to a} f(x)$$

### ตัวอย่าง: น้ำหนักแมว
สมมติเราติดตามน้ำหนักแมว

| วัน | น้ำหนัก |
| :---: | :---: |
| 1 | 4.00 kg |
| 12 | 4.40 kg |
| 24 | 4.80 kg |
| 36 | 5.20 kg |
| 48 | 5.60 kg |

กำหนดให้ $f(x) = 4 + x$ โดย:
- $f(x) = \text{น้ำหนักแมว (หน่วยกิโลกรัม)}$
- $x = \text{เวลาเป็นเดือน}$

หาน้ำหนักที่เวลา $x$ เข้าใกล้ 2 เดือน:
$$\lim_{x \to 2} f(x)$$
$$= \lim_{x \to 2} (4 + x)$$
$$= 4 + \lim_{x \to 2} x$$
$$= 4 + 2$$
$$= 6\text{ kg}$$

**สรุป:** เมื่อเวลา $x$ เข้าใกล้ 2 เดือน น้ำหนักตามแบบจำลอง $f(x)$ จะเข้าใกล้ $6\text{ kg}$

