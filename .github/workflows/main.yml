## เชื่อมโยงกับการเลี้ยงสัตว์

ใช้แนวคิดลิมิตเพื่อศึกษาการเปลี่ยนแปลงที่เกิดขึ้นทีละน้อย เช่น น้ำหนักที่เพิ่มขึ้นตามเวลา

### สรุปแนวโน้ม
- น้ำหนักกำลังเข้าใกล้ระดับใด?
- การเพิ่มน้ำหนักเริ่มช้าลงหรือไม่?

---

## ถ้าน้องแมวออกกำลังกายเพิ่ม?

สมมติว่าเราบันทึกข้อมูล:

| เวลาออกกำลังกาย | พลังงานที่ใช้ |
| :---: | :---: |
| 10 นาที | 30 kcal |
| 20 นาที | 60 kcal |
| 30 นาที | 90 kcal |
| 40 นาที | 120 kcal |

จะเห็นว่าโดยประมาณ: $\text{พลังงาน} \propto \text{เวลา}$

**อัตราการใช้พลังงานเฉลี่ย:**
$$\frac{120 - 30}{40 - 10} = \frac{90}{30} = 3\text{ kcal/นาที}$$

ดังนั้น แบบจำลองนี้ให้ค่าประมาณ $3\text{ kcal/นาที}$

ถ้าออกกำลังกายเพิ่มอีก 10 นาที:
$$3 \times 10 = 30\text{ kcal}$$

**สรุป:** น้องแมวจะใช้พลังงานเพิ่มประมาณ $30\text{ kcal}$

---

## แคลคูลัสกับปริมาณอาหารแมว

การใช้อินทิเกรตเพื่อหาพลังงานรวมและประมาณปริมาณอาหาร

### แนวคิด
เราสามารถใช้การอินทิเกรตเพื่อหาปริมาณพลังงานที่แมวใช้ตลอดช่วงเวลาหนึ่ง แล้วนำไปประมาณปริมาณอาหารที่ควรได้รับ  
*(การอินทิเกรต = การรวมค่าการเปลี่ยนแปลงเล็กๆ จำนวนมากเข้าด้วยกัน เพื่อหาค่ารวม)*

### ตัวอย่างง่ายๆ
สมมติว่าแมวตัวหนึ่งใช้พลังงานในอัตรา:
$$E(t) = 20 + 5t$$

โดย:
- $E(t) = \text{พลังงานที่ใช้ต่อชั่วโมง (kcal/hour)}$
- $t = \text{เวลาเป็นชั่วโมง}$

ต้องการหาว่าในช่วง 0-4 ชั่วโมง แมวใช้พลังงานทั้งหมดเท่าไร

### การคำนวณ
$$\text{พลังงานทั้งหมด} = \int_{0}^{4} (20 + 5t) \, dt$$
$$= \left[ 20t + \frac{5}{2}t^2 \right]_{0}^{4}$$
$$= 20(4) + \frac{5}{2}(4^2)$$
$$= 80 + 40$$
$$= 120\text{ kcal}$$

### นำไปใช้กับอาหารแมว
ถ้าอาหารแมวชนิดนี้ให้พลังงาน 4 kcal ต่ออาหาร 1 กรัม  
$$\text{ปริมาณอาหารที่ต้องใช้} = 120 \div 4 = 30\text{ กรัม}$$

**คำตอบ:** 30 กรัม

> **การอินทิเกรตช่วยอะไร?**  
> อัตราการใช้พลังงาน $\xrightarrow{\text{อินทิเกรต}}$ พลังงานที่ใช้ทั้งหมด $\xrightarrow{\text{คำนวณ}}$ ปริมาณอาหาร

**สรุป:** ในตัวอย่างนี้ แมวต้องการอาหารประมาณ 30 กรัม เพื่อชดเชยพลังงานที่ใช้ในช่วง 4 ชั่วโมง

> **หมายเหตุ:** ตัวเลขนี้เป็นเพียงตัวอย่างทางคณิตศาสตร์เพื่ออธิบายหลักการ ไม่ใช่คำแนะนำปริมาณอาหารจริงสำหรับแมว เพราะการให้อาหารจริงควรพิจารณาน้ำหนัก อายุ สุขภาพ และพลังงานของอาหารแต่ละชนิดด้วย

---

## สรุปและข้อเสนอแนะสำหรับการเลี้ยงสัตว์เลี้ยง

การใช้สมการและกราฟในการวิเคราะห์สุขภาพสัตว์เลี้ยงมีประโยชน์อย่างมากดังนี้:
1. ช่วยคิดตามและปรับปริมาณอาหารและกิจกรรมให้เหมาะสมกับสัตว์เลี้ยงแต่ละตัว
2. ประเมินสุขภาพและการเจริญเติบโตได้อย่างแม่นยำโดยใช้ข้อมูลในการเก็บข้อมูลน้ำหนัก อาหาร และกิจกรรมเป็นประจำอย่างสม่ำเสมอ
3. นำความชันและอนุพันธ์มาใช้วิเคราะห์แนวโน้มการเปลี่ยนแปลงของน้ำหนักได้อย่างมีประสิทธิภาพ

